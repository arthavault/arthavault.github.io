name: unpack
on:
  push:
    paths: ['downloads/*.zip']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -e
          ls downloads
          Z=$(ls downloads/*.zip | head -n 1)
          unzip -o "$Z" -d _x
          cp -r _x/site/. .
          rm -rf _x downloads/*.zip README.txt
          git config user.name "github-actions"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Unpack website" || exit 0
          git push
